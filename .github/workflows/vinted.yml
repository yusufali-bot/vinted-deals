name: Vinted deal check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # lets you run it manually to test

permissions:
  contents: write            # needed to save seen_items.json

concurrency:
  group: vinted
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests anthropic

      - name: Check Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python vinted_deal_agent.py

      - name: Save seen items
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_items.json
          git diff --cached --quiet || (git commit -m "update seen items [skip ci]" && git push)
